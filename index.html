<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: fadeIn 2s;
}

h1 {
  color: #ff4d6d;
}

p {
  font-size: 18px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>

<div class="card">
  <h1>🎂 Happy birthday! 🎉</h1>
  <p>May you live long, always be healthy, and may all your dreams come true.🤍</p>
  <button onclick="alert('Hello happy birthday. I hope you become even better at your current age and that you achieve all your dreams. Stay the same Upi that I know so well. Always be healthy bro. Keep your health you have to achieve the goals you want so you have to stay healthy you have to always try in between your high dreams. Im here to pray that you achieve your dream of becoming a sailor yes Im sure you can do it look for me when your world is not going well. Even though Im not good at giving solutions at least I can listen to your story tell me everything dont keep it to yourself I love you 💖')">
   Click this
  </button>
</div>

</body>
</html>
